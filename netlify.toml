# Netlify 빌드 설정
# - 실제 사이트(main 머지) 배포: Vite 빌드 결과(dist)를 그대로 올립니다.
# - PR 미리보기(deploy preview)·브랜치 배포는 빌드를 건너뜁니다.
#   PR마다 미리보기를 빌드하면서 크레딧이 빨리 떨어져 실제 배포가 멈춘 적이 있어서입니다.
#   미리보기가 다시 필요하면 아래 두 [context.*] 블록을 지우면 됩니다.

[build]
  command = "npm run build"
  publish = "dist"

# 로그인 서버(구글·카카오 연결, 비밀번호 확인): netlify/functions/*.mjs → /api/auth/*
# 필요한 환경변수: FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY, KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET, SESSION_SECRET
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
