# Netlify 빌드 설정
# - 실제 사이트(main 머지) 배포: Vite 빌드 결과(dist)를 그대로 올립니다.
# - PR 미리보기(deploy preview)·브랜치 배포는 빌드를 건너뜁니다.
#   PR마다 미리보기를 빌드하면서 크레딧이 빨리 떨어져 실제 배포가 멈춘 적이 있어서입니다.
#   미리보기가 다시 필요하면 아래 두 [context.*] 블록을 지우면 됩니다.
# - 실제 배포도 머지할 때마다 크레딧을 씁니다. 작은 수정은 PR 하나로 모아서 한 번에 머지하세요.

[build]
  command = "npm run build"
  publish = "dist"

# 로그인 서버(구글·카카오 연결, 비밀번호 확인): netlify/functions/*.mjs → /api/auth/*
# 필요한 환경변수: FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY, KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET, SESSION_SECRET
# (선택) STUDENT_LOGIN_OPEN=1: 학생·교과부장 로그인 다시 열기(보안 3-2 전까지 기본 막힘)
# (선택) ADMIN_BOOTSTRAP_PASSWORD: 관리자 계정이 하나도 없을 때만 쓰는 첫 관리자(아이디 admin) 비밀번호, 12자 이상
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

# 보안 헤더: 다른 사이트가 이 화면을 몰래 틀 안에 넣기(클릭재킹)·파일 형식 속이기·주소 새기 막기, 항상 https
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
